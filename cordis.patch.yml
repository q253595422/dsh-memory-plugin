# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# The shared memory service. `memhost3.mjs` sits beside this patch file and
# publishes the `memory` service (durable store under `$DSH_HOME/memory/`).
# It is a HOST row: the service is read by tool rows from more than one
# session, so it cannot live behind any preset realm.
# v3: title/keywords/scope/pinned fields, keyword relevance search,
# per-scope filters, pin/unpin; all returned entries are undefined-free JSON.
- insert:
    - id: memory-host
      name: './memhost3.mjs'

# The automatic memory row. `auto-memory5.mjs` listens to
# `agent/turn-stopping` and writes one entry per human-initiated turn into
# the shared `memory` service. v5: 借鉴 Memorax Code 四类 Memory 架构
# (coding/repo/personal/procedure)，LLM 结构化输出自动分类，按类型桶分
# 进行知识卡片聚类合并。Fire-and-forget：不阻塞会话关闭。HOST 行，必须
# 在 `memory-host` 之后。
- insert:
    - id: auto-memory
      name: './auto-memory5.mjs'

# The memory recall injection row. `memory-inject2.mjs` registers one
# `systemPrompt.section` (`memory:recall`, order 95) whose text is a short
# snapshot of the shared store — pinned entries first, then the newest auto
# summaries — so long-term knowledge is available to every model request
# without the model calling `memory_search`. It injects into the HOST
# `systemPrompt` registry, so it cannot live behind any preset realm.
# Order: after the memory service (and ideally after auto-memory so refresh
# sees newest entries); refreshes on a 15s timer and on turn-stopping.
- insert:
    - id: memory-inject
      name: './memory-inject2.mjs'

# The memory visualization UI plugin. `memui.mjs` exposes the memory
# service via window.__dshMemory for debugging and future UI integration.
- insert:
    - id: memui
      name: './memui.mjs'

# ─── v5 知识卡片聚类已集成到 auto-memory5.mjs（按类型桶分，分批 LLM 聚类）
